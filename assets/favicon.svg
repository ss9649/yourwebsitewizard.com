<!-- No width/height attributes: viewBox alone lets this scale to any size.
     Weights are deliberately heavy — a favicon has to survive being drawn
     into a 16px box, where hairlines turn to grey mush. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lumen &amp; Rose">
  <title>Lumen &amp; Rose</title>

  <rect width="64" height="64" rx="12" fill="#000000"/>

  <!-- Ring handles, finger brace, and the shanks running down to the pivot.
       Stroked rather than filled so the weight stays even when scaled down. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round">
    <circle cx="22" cy="18.5" r="6.2"/>
    <circle cx="42" cy="18.5" r="6.2"/>

    <!-- Finger brace curling off the top of the left handle. -->
    <path d="M17.62 14.12 C14.4 10.2 15.4 5.8 19.6 5.6"/>

    <!-- Shanks bow inward on the way down, which is what gives real shears
         their flow. Each crosses over to the opposite blade. -->
    <path d="M25.01 23.92 Q27.2 30 32 36.5"/>
    <path d="M38.99 23.92 Q36.8 30 32 36.5"/>
  </g>

  <!-- Blades, tapering from the pivot to a point. Filled triangles keep the
       tips sharp at any size, where a stroke would go blunt. -->
  <g fill="#FFFFFF">
    <path d="M30.24 37.82 L48.5 58.5 L33.76 35.18 Z"/>
    <path d="M30.24 35.18 L15.5 58.5 L33.76 37.82 Z"/>
  </g>

  <!-- Pivot screw, knocked out of the white so it reads as a hole. -->
  <circle cx="32" cy="36.5" r="1.4" fill="#000000"/>
</svg>
